<style>
:root{
  --lime:#F5F1EA;--lime2:#FAF7F1;--card:#FCFAF5;--basalt:#0F0F0E;--terra:#B84C2E;--terra-d:#A03F24;
  --olive:#5C6B4A;--kekova:#2B4C5C;--stone:#7A756C;--line:rgba(15,15,14,.14);--line2:rgba(15,15,14,.08);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--basalt)}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--lime);color:var(--basalt);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--kekova);text-decoration:none}
h1,h2,h3{font-family:var(--serif);font-weight:400}

/* ---- sidebar ---- */
.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--basalt);color:var(--lime);display:flex;flex-direction:column;z-index:30}
.side .brand{padding:26px 22px 20px;border-bottom:1px solid rgba(245,241,234,.12)}
.side .brand img{height:13px;display:block}
.side .brand .sub{margin-top:8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(245,241,234,.45)}
.nav{flex:1;padding:14px 0;overflow-y:auto}
.nav .grp{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,241,234,.35);padding:14px 22px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 22px;color:rgba(245,241,234,.78);font-size:13.5px;border-left:2px solid transparent}
.nav a svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{color:var(--lime);background:rgba(245,241,234,.05)}
.nav a.on{color:var(--lime);border-left-color:var(--terra);background:rgba(245,241,234,.07)}
.side .foot{padding:16px 22px;border-top:1px solid rgba(245,241,234,.12);display:flex;flex-direction:column;gap:9px}
.side .foot a,.side .foot button{background:none;border:none;cursor:pointer;text-align:left;font-family:var(--sans);font-size:12.5px;color:rgba(245,241,234,.6);padding:2px 0}
.side .foot a:hover,.side .foot button:hover{color:var(--lime)}

/* ---- main ---- */
.main{margin-left:230px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--lime);border-bottom:1px solid var(--line2);
     display:flex;align-items:baseline;justify-content:space-between;padding:18px 30px}
.top h1{font-size:26px;line-height:1.1}
.top .date{font-size:12px;color:var(--stone);letter-spacing:.06em}
.wrap{padding:26px 30px 60px;max-width:1060px;width:100%}
.lead{color:var(--stone);font-size:14px;max-width:640px;margin-bottom:22px}

/* ---- cards & grids ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--line2);border-top:2px solid var(--basalt);border-radius:2px;padding:16px 18px}
.kpi .lbl{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--terra)}
.kpi .val{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1.15;margin:4px 0 2px}
.kpi .note{font-size:12px;color:var(--stone)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mod{display:block;background:var(--card);border:1px solid var(--line2);border-radius:2px;padding:20px;color:var(--basalt)}
.mod:hover{border-color:var(--basalt)}
.mod h3{font-size:20px;margin-bottom:4px}
.mod p{font-size:13px;color:var(--stone)}
.mod .tag{display:inline-block;margin-top:10px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:2px;padding:22px;margin-bottom:20px}
.panel h2{font-size:22px;margin-bottom:12px}
.panel h2 .cnt{font-family:var(--sans);font-size:12px;color:var(--stone);margin-left:8px}

/* ---- checklist ---- */
.ck{list-style:none}
.ck li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.ck li:last-child{border-bottom:none}
.ck input{margin-top:3px;accent-color:var(--terra);width:15px;height:15px;flex:none;cursor:pointer}
.ck .hint{display:block;font-size:12px;color:var(--stone)}
.ck code{background:rgba(15,15,14,.06);padding:1px 5px;border-radius:2px;font-size:12px}
.ck li.done label{color:var(--stone);text-decoration:line-through}
.ck label{cursor:pointer}

/* ---- table ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td code{background:rgba(15,15,14,.06);padding:1px 5px;border-radius:2px;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- forms & buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.04em;
     padding:11px 18px;border-radius:2px;cursor:pointer;border:1px solid var(--basalt);background:var(--basalt);color:var(--lime)}
.btn:hover{background:#2B2B29}
.btn.ghost{background:transparent;color:var(--basalt)}
.btn.ghost:hover{background:rgba(15,15,14,.06)}
.btn.terra{background:var(--terra);border-color:var(--terra)}
.btn.terra:hover{background:var(--terra-d)}
input[type=text],input[type=password],input[type=number],input[type=date],select{
  font-family:var(--sans);font-size:14px;color:var(--basalt);background:#fff;
  border:1px solid var(--line);border-radius:2px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--basalt)}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.frow .f{flex:1;min-width:130px}
.frow label{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-bottom:5px}
.note-box{background:var(--lime2);border:1px solid var(--line2);border-left:2px solid var(--terra);padding:12px 15px;font-size:13px;color:rgba(15,15,14,.75);margin:14px 0}
pre.code{background:#14231b0d;background:rgba(15,15,14,.05);border:1px solid var(--line2);padding:14px;font-size:12px;overflow-x:auto;border-radius:2px;line-height:1.5}

/* ---- app frame (CRM / Content) ---- */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 30px;background:var(--lime);border-bottom:1px solid var(--line2)}
.appbar .t{font-family:var(--serif);font-size:22px}
.appbar .r{display:flex;gap:14px;align-items:center;font-size:12.5px}
.appframe{flex:1;border:none;width:100%;min-height:calc(100vh - 118px)}

/* ---- login ---- */
.login-body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
  background:var(--lime);padding:24px;position:relative;overflow:hidden}
.login-ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:min(78vw,520px);
  opacity:.05;user-select:none;pointer-events:none}
.login-card{position:relative;width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
  border-top:2px solid var(--basalt);border-radius:2px;padding:44px 40px 34px;text-align:center;
  box-shadow:0 1px 2px rgba(15,15,14,.04),0 18px 48px rgba(15,15,14,.06)}
.login-card .mark{height:15px;width:auto;margin:0 auto}
.login-card .eyebrow{display:block;font-size:10px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
  color:var(--terra);margin-top:14px}
.login-card .rule{width:44px;height:1px;background:var(--line);margin:22px auto}
.login-card h1{font-family:var(--serif);font-weight:300;font-size:27px;line-height:1.2;margin-bottom:6px}
.login-card .say{font-size:13.5px;color:var(--stone);margin-bottom:24px}
.login-card .field{text-align:left;margin-bottom:4px}
.login-card label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--stone);margin-bottom:6px}
.login-card input{padding:12px 13px}
.login-card .err{color:var(--terra);font-size:12.5px;margin:9px 0 0;min-height:17px;text-align:left}
.login-card .go{width:100%;justify-content:center;margin-top:8px;padding:13px 18px}
.login-card .fine{font-size:11.5px;color:var(--stone);margin-top:22px;line-height:1.55;
  border-top:1px solid var(--line2);padding-top:16px}
@media(max-width:900px){
  .side{position:static;width:auto;bottom:auto}
  .nav{display:flex;flex-wrap:wrap;padding:4px 10px}
  .nav .grp{display:none}
  .nav a{border-left:none;border-bottom:2px solid transparent;padding:10px 12px}
  .nav a.on{border-bottom-color:var(--terra)}
  .side .foot{flex-direction:row;gap:18px}
  .main{margin-left:0}
  .top,.wrap,.appbar{padding-left:18px;padding-right:18px}
}

<script>
/* Anthifel Dashboard — ortak mantık.
   ŞİFREYİ DEĞİŞTİRMEK İÇİN: aşağıdaki PASS değerini düzenleyin.
   Not: Bu istemci tarafı bir ön kapıdır (statik site). Caydırıcıdır ama gerçek
   güvenlik değildir — bu panelde hassas veri SAKLAMAYIN. */
var PASS = 'anthifel2026';

function store(){ try{ return window.localStorage; }catch(e){ return null; } }
function ses(){ try{ return window.sessionStorage; }catch(e){ return null; } }

function guard(){
  var s = ses();
  if (!s || s.getItem('anc_dash_auth') !== '1'){ location.replace('index.html'); }
}
function doLogin(){
  var el = document.getElementById('pw');
  if (el.value.trim() === PASS){
    var s = ses(); if (s) s.setItem('anc_dash_auth','1');
    location.href = 'overview.html';
  } else {
    document.getElementById('err').textContent = 'Şifre yanlış.';
    el.value=''; el.focus();
  }
  return false;
}
function logout(){
  var s = ses(); if (s) s.removeItem('anc_dash_auth');
  location.href = 'index.html';
}
/* checklist persist */
function ckInit(page){
  var st = store(); if (!st) return;
  document.querySelectorAll('.ck input[type=checkbox]').forEach(function(c,i){
    var k = 'anc_ck_' + page + '_' + (c.id || i);
    if (st.getItem(k) === '1'){ c.checked = true; c.closest('li').classList.add('done'); }
    c.addEventListener('change', function(){
      st.setItem(k, c.checked ? '1' : '0');
      c.closest('li').classList.toggle('done', c.checked);
    });
  });
}
function today(){
  var d=new Date(), g=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  var a=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  return d.getDate()+' '+a[d.getMonth()]+' '+d.getFullYear()+', '+g[d.getDay()];
}
function daysTo(iso){ return Math.ceil((new Date(iso) - new Date())/86400000); }
function copyText(id, btn){
  var t = document.getElementById(id).textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){
    var o = btn.textContent; btn.textContent='Kopyalandı ✓'; setTimeout(function(){btn.textContent=o;},1500);
  }).catch(function(){ window.prompt('Kopyalayın:', t); });
}
</script>
