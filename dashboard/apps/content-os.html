<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anthifel Content OS</title>
<style>
:root{
  --lime:#F5F1EA;--basalt:#0F0F0E;--terra:#B84C2E;--olive:#5C6B4A;--kekova:#2B4C5C;--stone:#7A756C;
  --line:#E3DCD0;--line2:#EFEAE1;--card:#FBF9F5;--white:#fff;
  --sh:0 1px 2px rgba(15,15,14,.04),0 2px 8px rgba(15,15,14,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--lime);color:var(--basalt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.sf{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:400}
h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif;font-weight:400;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}

/* ── shell ── */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:216px;flex:0 0 216px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.bd{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.bd .wm{font-family:Georgia,serif;font-size:17px;letter-spacing:.2em;text-transform:uppercase}
.bd .sb{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--stone);margin-top:5px}
nav{padding:10px 0;flex:1}
nav a{display:flex;align-items:center;gap:9px;padding:7px 20px;color:var(--basalt);text-decoration:none;font-size:13.5px;cursor:pointer;border-left:2px solid transparent}
nav a:hover{background:rgba(184,76,46,.05)}
nav a.on{border-left-color:var(--terra);background:rgba(184,76,46,.08);font-weight:500}
nav a .ic{width:15px;text-align:center;opacity:.55;font-size:12px}
nav a .ct{margin-left:auto;font-size:10.5px;color:var(--stone);background:var(--line2);padding:1px 6px;border-radius:8px}
nav .gp{padding:15px 20px 5px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone)}
.sfoot{padding:14px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--stone)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--stone);margin-right:6px}
.dot.sv{background:var(--olive)}.dot.un{background:var(--terra)}

.wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 26px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.top h1{font-size:20px;margin-right:auto}
.body{flex:1;overflow-y:auto;padding:22px 26px 70px}
.inner{max-width:1240px}

/* ── controls ── */
button,.btn{font-size:12.5px;padding:6px 12px;border:1px solid var(--line);background:var(--white);border-radius:3px;cursor:pointer;text-decoration:none;color:var(--basalt);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--stone)}
button.p{background:var(--terra);border-color:var(--terra);color:#fff}
button.p:hover{opacity:.9;border-color:var(--terra)}
button.on{background:var(--basalt);border-color:var(--basalt);color:var(--lime)}
button.gh{background:transparent;border-color:transparent}
button.gh:hover{background:var(--line2);border-color:transparent}
select,input[type=text],input[type=date],input[type=time],textarea{padding:6px 9px;border:1px solid var(--line);background:var(--white);border-radius:3px;font-size:12.5px;width:100%}
textarea{resize:vertical;line-height:1.6;font-size:13.5px}
label.fl{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--stone);margin-bottom:5px}
.fr{margin-bottom:13px}
.fg{display:grid;gap:11px}
.f2{grid-template-columns:1fr 1fr}
.f3{grid-template-columns:1fr 1fr 1fr}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.lb{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--stone)}

/* ── stats ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 16px;box-shadow:var(--sh)}
.kpi .n{font-family:Georgia,serif;font-size:27px;line-height:1.05}
.kpi .n small{font-size:14px;color:var(--stone)}
.kpi .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-top:6px}
.kpi .d{font-size:11.5px;color:var(--stone);margin-top:4px}
.trk{height:3px;background:var(--line2);margin-top:10px;border-radius:2px;overflow:hidden}
.fil{height:100%;background:var(--terra);transition:width .3s}
.fil.ok{background:var(--olive)}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:var(--sh);margin-bottom:16px}
.card>h3{padding:12px 17px;border-bottom:1px solid var(--line);font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>h3 .rt{margin-left:auto;display:flex;gap:6px;align-items:center}
.card .in{padding:15px 17px}
.card .in.tight{padding:4px 17px 12px}

/* ── post row ── */
.pr{display:grid;grid-template-columns:64px 22px 1fr auto auto;gap:11px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.pr:last-child{border-bottom:none}
.pr:hover{background:var(--white)}
.pr .dt{font-size:11px;color:var(--stone);line-height:1.35}
.pr .ti{font-size:13.5px;line-height:1.4;min-width:0}
.pr .ti .sub{font-size:11.5px;color:var(--stone);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pr.done .ti>span:first-child{opacity:.5}
.ch{width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;color:#fff;flex:0 0 22px}
.ch.blog{background:var(--basalt)}.ch.li-eray{background:var(--kekova)}.ch.li-ant{background:#4a6a7d}
.ch.x-eray{background:var(--basalt);border:1px solid var(--stone)}.ch.x-ant{background:var(--stone)}
.ch.nl{background:var(--olive)}

.tg{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--stone);white-space:nowrap}
.tg.vaka{border-color:var(--terra);color:var(--terra)}
.tg.cerceve{border-color:var(--kekova);color:var(--kekova)}
.tg.sektor{border-color:var(--olive);color:var(--olive)}
.tg.kisisel,.tg.marka{border-color:var(--stone)}
.tg.en{background:var(--basalt);color:var(--lime);border-color:var(--basalt)}

.st{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:11px;border:1px solid var(--line);white-space:nowrap;min-width:86px;text-align:center;background:var(--white)}
.st.s0{color:var(--stone)}
.st.s1{color:var(--kekova);border-color:#bcd0da;background:#f0f6f9}
.st.s2{color:#8a6a1f;border-color:#e2d3a8;background:#fbf6e8}
.st.s3{color:var(--olive);border-color:#c3cfb5;background:#f2f5ee}
.st.s4{background:var(--basalt);border-color:var(--basalt);color:var(--lime)}

/* ── calendar ── */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.cal .hd{background:var(--card);padding:8px 6px;text-align:center;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone)}
.cel{background:var(--card);min-height:112px;padding:6px 6px 7px;position:relative;min-width:0;overflow:hidden}
.cel.out{background:#f2eee7}
.cel.tod{background:#fff;box-shadow:inset 0 0 0 2px var(--terra)}
.cel .dn{font-size:11px;color:var(--stone);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.cel.out .dn{opacity:.4}
.cel .add{opacity:0;font-size:13px;line-height:1;padding:1px 4px;border:none;background:none;color:var(--stone);cursor:pointer}
.cel:hover .add{opacity:1}
.ev{display:flex;gap:4px;align-items:center;font-size:10.5px;padding:2px 4px;margin-bottom:2px;border-radius:2px;background:var(--white);border-left:2px solid var(--stone);cursor:pointer;line-height:1.3}
.ev:hover{background:var(--lime)}
.ev.blog{border-left-color:var(--basalt)}.ev.li-eray{border-left-color:var(--kekova)}
.ev.li-ant{border-left-color:#4a6a7d}.ev.x-eray,.ev.x-ant{border-left-color:var(--stone)}
.ev.nl{border-left-color:var(--olive)}
.ev .t{font-size:9.5px;color:var(--stone);flex:0 0 auto}
.ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.pub{opacity:.5}
.sil{background:rgba(184,76,46,.1);border-left:2px solid var(--terra);font-size:9.5px;padding:2px 4px;color:var(--terra);border-radius:2px;margin-bottom:2px}

/* ── board ── */
.bo{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:3px;min-height:120px}
.col>h4{padding:9px 12px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);display:flex;justify-content:space-between}
.col .cin{padding:8px;min-height:60px}
.bc{background:var(--white);border:1px solid var(--line);border-radius:3px;padding:8px 9px;margin-bottom:7px;cursor:grab;font-size:12.5px;line-height:1.4}
.bc:active{cursor:grabbing}
.bc.drag{opacity:.4}
.bc .m{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:10.5px;color:var(--stone);flex-wrap:wrap}
.col.over .cin{background:rgba(184,76,46,.06)}

/* ── composer ── */
.scrim{position:fixed;inset:0;background:rgba(15,15,14,.42);z-index:60;display:none}
.scrim.on{display:block}
.dlg{position:fixed;top:0;right:0;height:100vh;width:min(720px,100%);background:var(--lime);border-left:1px solid var(--line);z-index:70;transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.dlg.on{transform:none}
.dh{padding:15px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--card)}
.dh h2{font-size:17px;margin-right:auto}
.dbody{flex:1;overflow-y:auto;padding:20px 24px 40px}
.dfoot{padding:12px 24px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--card)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;padding:7px 12px;font-size:12.5px;color:var(--stone)}
.tabs button.on{border-bottom-color:var(--terra);color:var(--basalt);background:none}
.cnt{font-size:11px;color:var(--stone);text-align:right;margin-top:4px}
.cnt.over{color:var(--terra)}
.lint{margin-top:10px;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:9px 11px;background:var(--card)}
.lint.bad{border-color:var(--terra);background:rgba(184,76,46,.05)}
.lint.good{border-color:#c3cfb5;background:#f2f5ee}
.lint b{font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* preview */
.pv{border:1px solid var(--line);border-radius:6px;background:var(--white);padding:14px;max-width:520px}
.pv .ph{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.pv .av{width:40px;height:40px;border-radius:50%;background:var(--basalt);color:var(--lime);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:16px}
.pv .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.pv .sub{font-size:11.5px;color:var(--stone)}
.pv .txt{font-size:13.5px;white-space:pre-wrap;line-height:1.55}
.pv .fold{color:var(--stone);font-size:12px;margin-top:6px}
.pv.x{border-radius:12px}
.pv.x .av{border-radius:50%}

/* misc */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--stone);font-weight:400;background:var(--card)}
.mut{color:var(--stone)}
.no{color:var(--terra)}
.ok{color:var(--olive)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--terra)}
.chk.k span{opacity:.45;text-decoration:line-through}
pre.tpl{background:var(--white);border:1px solid var(--line);padding:13px;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,'SF Mono',Menlo,monospace;line-height:1.6;border-radius:3px;margin:7px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--basalt);color:var(--lime);padding:10px 20px;font-size:12.5px;border-radius:3px;z-index:90;transition:transform .24s}
.toast.on{transform:translateX(-50%) translateY(0)}
.hid{display:none!important}
.empty{padding:36px;text-align:center;color:var(--stone);font-size:13px}
a.ex{color:var(--kekova);text-decoration:none;border-bottom:1px solid var(--line)}
a.ex:hover{border-color:var(--kekova)}
.note{border-left:3px solid var(--terra);background:rgba(184,76,46,.05);padding:11px 14px;font-size:13px;margin-bottom:14px;border-radius:0 3px 3px 0}
.note.o{border-left-color:var(--olive);background:rgba(92,107,74,.06)}
@media(max-width:1000px){
  .app{flex-direction:column;height:auto;overflow:visible}
  .side{width:100%;flex:none}
  nav{display:flex;flex-wrap:wrap;padding:6px 12px}
  nav a{border-left:none;padding:6px 10px}
  nav a.on{border-left:none;background:var(--line2)}
  nav .gp,nav a .ct{display:none}
  .body{overflow:visible;padding:18px 14px 60px}
  .bo{grid-template-columns:1fr}
  .cal{font-size:11px}
  .cel{min-height:74px}
  .pr{grid-template-columns:1fr;gap:6px}
  .dlg{width:100%}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side">

  <nav id="nav">

    <a data-v="dash"><span class="ic">◆</span>Panel</a>
    <a data-v="cal"><span class="ic">▦</span>Takvim<span class="ct" id="c-cal"></span></a>

    <a data-v="social"><span class="ic">◈</span>Sosyal<span class="ct" id="c-soc"></span></a>
    <a data-v="accounts"><span class="ic">⬡</span>Hesaplar</a>
    <div class="gp">Plan</div>

    <a data-v="analytics"><span class="ic">◐</span>Hedefler</a>
    <div class="gp">Kütüphane</div>
    <a data-v="rules"><span class="ic">§</span>Kurallar ve ses</a>
    <a data-v="types"><span class="ic">◎</span>İçerik tipleri</a>
    <a data-v="src"><span class="ic">↗</span>Kaynaklar</a>
    <a data-v="data"><span class="ic">⌸</span>Veri</a>
  </nav>
  <div class="sfoot"><span class="dot" id="sdot"></span><span id="stxt">Kaydedilmedi</span></div>
 </aside>

 <div class="wrap">
  <div class="top">
    <h1 id="ttl">Panel</h1>

    <button onclick="loadFile()">Aç</button>
  </div>
  <div class="body"><div class="inner" id="main"></div></div>
 </div>
</div>

<div class="scrim" id="scrim" onclick="closeC()"></div>
<aside class="dlg" id="dlg"></aside>
<div class="toast" id="toast"></div>

function E(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function fs(s){const d=pd(s);return d.getDate()+' '+MS[d.getMonth()]}
function fl(s){const d=pd(s);return d.getDate()+' '+MS[d.getMonth()]+' '+DS[(d.getDay()+6)%7]}
function tod(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}

function upStat(){

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2100)}
function copy(x,m){const a=document.createElement('textarea');a.value=x;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(m||'Kopyalandı')}catch(e){toast('Kopyalanamadı')}document.body.removeChild(a)}
function byDate(a,b){return a.date===b.date?(a.time||'').localeCompare(b.time||''):a.date.localeCompare(b.date)}
function chip(p){return `<span class="ch ${p.ch}">${CH[p.ch].s}</span>`}
function stTag(p){return `<span class="st s${p.status}" data-cyc="${p.id}">${STA[p.status]}</span>`}
function fweek(d){const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x}

/* lint */
function lint(txt,ch){
  const out=[];
  if(!txt||!txt.trim())return out;
  BAN.forEach(w=>{if(new RegExp('\\b'+w.replace(/[-\s]/g,'[-\\s]?'),'i').test(txt))out.push({s:'Yasak kelime: '+w,l:1})});
  GEO.forEach(w=>{if(new RegExp(w,'i').test(txt))out.push({s:'Coğrafi referans: '+w,l:1})});
  FIRMS.forEach(w=>{if(new RegExp(w,'i').test(txt))out.push({s:'Şirket ismi: '+w+' — anonimleştir',l:1})});
  if(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/u.test(txt))out.push({s:'Emoji',l:1});
  if(/!/.test(txt))out.push({s:'Ünlem',l:1});
  if(/"/.test(txt))out.push({s:'Düz tırnak — curly kullan',l:2});
  const hs=(txt.match(/#\w+/g)||[]).length;
  if(ch&&ch.startsWith('x-')&&hs>0)out.push({s:'X\'te hashtag kullanılmaz',l:1});
  if(ch&&ch.startsWith('li-')&&hs>3)out.push({s:'LinkedIn hashtag en fazla 3 (şu an '+hs+')',l:1});
  const w=txt.trim().split(/\s+/).length;
  if(ch&&ch.startsWith('li-')&&w>250)out.push({s:w+' kelime — 250 üstü blog yazısıdır',l:2});
  const first=(txt.trim().split(/\n/)[0]||'');
  if(/^(Günümüzde|Bugünlerde|Son (yıllarda|dönemde)|Artık\s+(herkes|hepimiz|hiç)|Bilindiği üzere|Herkesin bildiği|Teknoloji dünyasında|Yapay zeka\s+(çağı|artık|günümüzde))/i.test(first))out.push({s:'Genel tespitle açılıyor — somut bir anla aç',l:1});
  return out;
}

function addShelf(k){
  const s=SHELF.find(x=>x[0]===k);if(!s)return;
  const d=new Date(tod());d.setDate(d.getDate()+7);
  P.push({id:uid(),date:iso(d),time:'09:00',ch:'blog',type:'blog',pillar:s[2],lang:'tr',title:s[1],body:'',note:'Raf yazısı '+k+' — '+s[3],enDate:'',status:0,checks:{}});
  mark();render();toast(k+' takvime alındı');
}

/* ═══════════ KAYIT ═══════════ */
async function pickFile(){
  if(!window.showSaveFilePicker){toast('Tarayıcınız desteklemiyor — indir/aç kullanın');return}
  try{
    fh=await window.showSaveFilePicker({suggestedName:'anthifel-content.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
    await writeFH();toast('Çalışma dosyası bağlandı — değişiklikler otomatik kaydedilecek');
  }catch(e){}
}
async function writeFH(){
  if(!fh)return false;
  const w=await fh.createWritable();
  await w.write(JSON.stringify({v:2,saved:new Date().toISOString(),posts:P},null,1));
  await w.close();dirty=false;upStat();return true;
}
async function saveNow(){
  if(fh){await writeFH();toast('Kaydedildi — '+fh.name);return}
  const b=new Blob([JSON.stringify({v:2,saved:new Date().toISOString(),posts:P},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='anthifel-content-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(a.href);
  dirty=false;upStat();toast('Dosya indirildi');
}
function loadFile(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
   r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.posts)throw 0;P=d.posts;dirty=false;upStat();render();toast('Yüklendi — '+P.length+' kayıt')}catch(e){toast('Dosya okunamadı')}};
   r.readAsText(f)};
  i.click();
}
function expCSV(){
  const hd=['tarih','saat','kanal','tip','sutun','dil','durum','baslik','metin','not'];
  const rows=P.slice().sort(byDate).map(p=>[p.date,p.time,CH[p.ch].n,TYP[p.type]||p.type,PIL[p.pillar]||p.pillar,p.lang,STA[p.status],p.title,(p.body||'').replace(/\n/g,' '),p.note]);
  const csv=[hd,...rows].map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='anthifel-content.csv';a.click();URL.revokeObjectURL(a.href);
  toast('CSV indirildi');
}
let autoT=null;
function scheduleAuto(){if(!fh)return;clearTimeout(autoT);autoT=setTimeout(()=>writeFH(),1200)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* drag & drop */
function bindBoard(){
  if(view!=='board')return;
  let dragId=null;
  document.querySelectorAll('.bc').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move'});
    c.addEventListener('dragend',()=>{c.classList.remove('drag');document.querySelectorAll('.col').forEach(x=>x.classList.remove('over'))});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{
      e.preventDefault();col.classList.remove('over');
      const p=P.find(x=>x.id===dragId);
      if(p){p.status=+col.dataset.col;mark();render();toast(p.title.slice(0,32)+' → '+STA[p.status])}
    });
  });
}
